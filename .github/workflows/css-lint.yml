
name: CSS Linting

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"

jobs:
  csslint:
    name: Check CSS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Stylelint
        run: npm install --global stylelint

      - name: Run Stylelint
        run: stylelint "**/*.css"
