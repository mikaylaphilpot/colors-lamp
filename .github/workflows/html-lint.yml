
name: HTML Linting

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"

jobs:
  htmlhint:
    name: Check HTML
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install HTMLHint
        run: npm install --global htmlhint

      - name: Run HTMLHint
        run: htmlhint "**/*.html"
