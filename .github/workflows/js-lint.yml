
name: JavaScript Linting

on:
  push:
    branches:
      - "**"

  pull_request:
    branches:
      - "**"

jobs:
  eslint:
    name: Check JavaScript
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install ESLint
        run: npm install --global eslint@9

      - name: Run ESLint
        run: eslint "**/*.js"
